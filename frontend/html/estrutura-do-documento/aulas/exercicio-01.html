
<!DOCTYPE html> 
<!-- O DOCTYPE avisa ao navegador que o tipo de documento no caso html5. e deve fica no topo do arquivo-->

<html> 
    <!-- a tag html envolve todo o conteudo e é o elemento raiz da pagina  -->  

    <head>  
 <!-- a tag heade serve para guarda metadados, configurações e recursos que não são visveis --> 
    </head>

    <body>
        <!-- A tag body é o corpo da pagina, onde fica todo o conteudo visivel -->
    </body>
</html>
