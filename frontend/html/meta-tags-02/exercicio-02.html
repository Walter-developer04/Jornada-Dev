<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <!-- METADADOS QUE NÃO SÃO MUITO UTILIZADOS   -->
         <!-- =========== OPEN GRAPH ========== -->
          <!-- Controla como o link aparece quando compartilhado no facebook, likedIn, etc.
           Sem isso, o site pega o titulo e descrição padrão -->


           <!-- og: titulo que aparece no card do Facebook/Likedin -->
        <meta property="og:title" content="">

        <!-- og:description: texto abaixo do titulo no card -->
         <meta property="og:description" content="">

         <!-- og:image: imagem do card (precisa de URL da imagem real)-->

         <meta property="og:image" content="" />

         <!-- og:image:alt: texto alternativo -->
          <meta  property="og:image:alt" content=""/>


            <!--- ========== TWITTER CARDS ========== -->
        <!-- Controla como o link aparece quando compartilhado no Twitter/X. Usar atributo "name" com prefixo "twitter:" em vez de "property" -->

        <!-- twitter:card: tipo de card (imagem grande, imagem pequena, etc) -->
         <meta name="twitter:card" content="summary_large_image" />
         <!-- twitter:title: titulo do card no tiwtter -->
          <meta name="twitter:title" content="">

          <!-- twitter:description: descrição do card no twitter -->
           <meta name="twitter:description" content="" />

           <!-- twitter:image:src: image do card (precisa de URL real)-->
            <meta name="twitter:image:src" content="" />

            <!--twiter:image:alt: texto alternativo da imagem -->
            <meta name="twitter:image:alt" content="" />

            <!-- ========== SEO ========== -->

            <!-- robots: diz ao google se dev indexar a página e seguir os links
             "index, follow" e o padrão, só  precisa declarar se quiser BLOQUEA -->
             <meta name="robots" content="index, follow" />

             <!-- canonical: URL oficial da página.
              Evitar que o google trate variações da URL como conteúdo duplicado -->
              <link rel="canonical" href="" />

              <!-- ========== IDIOMAS =========== -->
               <!-- alternate: indica que a página de origem existe em outro idioma.
                hreflang diz qual idioma/região cada versão atende -->
                <link rel="alternate" href="" hreflang="pt-BR" />
                <link rel="alternate" href="" hreflang="en" />

                <title>Meta tags</title>

    </head>
    <body>
    </body>
</html>
