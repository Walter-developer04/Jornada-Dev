<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula: Hierarquia de Título</title>
</head>

<body>
    <!--      ===============================
              O QUE É HIERARQUIA DE TÍTULOS ?
              ===============================  

        A hierarquia de títulos serve para organizar o conteúdo
        da página do mais importante para o menos importante.

        É como uma empresa: há um presidente (h1), diretores (h2),
        gerentes (h3), supervisores (h4), coordenadores (h5) e
        assistentes (h6).       
        
        REGRAS DE OURO:
        1. Use apenas UM <h1> por página (é o título principal)
        2. Nunca pule níveis (não vá de h2 direto para h4)
        3. Os títulos devem descrever o conteúdo que vem depois
                                                                  
        ============================================
                 <h1> — TÍTULO PRINCIPAL 
        ============================================
         Para que serve:
        O <h1> é o título mais importante da página inteira.
        É como o nome do livro na capa. Só pode haver UM por página.

        O navegador mostra ele no maior tamanho automaticamente.
        -->
    <h1>Receita de Bolo</h1>

    <!--
        ============================================
             <h2> — SUBTÍTULO IMPORTANTE
        ============================================

        Para que serve:
        O <h2> divide o conteúdo em grandes blocos, como capítulos.
        Cada <h2> representa uma seção principal do assunto.

        Aqui, "Bolo de Chocolate" é uma receita principal dentro
        do tema geral "Receitas de Bolo".
    -->
       <h2>Bolo de Chocolate</h2>


    <!--
        ============================================
             <h3> — SEÇÃO DENTRO DO CAPÍTULO
        ============================================

        Para que serve:
        O <h3> divide o conteúdo de um <h2> em partes menores.
        É como uma seção dentro de um capítulo.

        Aqui, "Ingredientes" é uma parte da receita de Bolo de Chocolate.
    -->
          <h3>Ingredientes</h3>
            <p>2 xícaras de farinha de trigo, 1 xícara de chocolate em pó, 2 ovos...</p>

    <!--
        ============================================
        Outro <h3> — outra seção dentro do mesmo <h2>
        ============================================

        "Modo de Preparo" também faz parte da receita de Bolo de Chocolate,
        então também é um <h3>.
    -->

         <h3>Modo de Preparo</h3>
           <p>Pré-aqueça o forno a 180°C. Misture os ingredientes secos...</p>

    <!--
        ============================================
        Outro <h2> — outro capítulo principal
        ============================================

        "Bolo de Cenoura" é outra receita principal, no mesmo nível
        de importância que "Bolo de Chocolate". Por isso, também é <h2>.
    -->
      <h2>Bolo de Cenoura</h2>


    <!--
        ============================================
        <h3> — seção dentro do novo <h2>
        ============================================

        "Ingredientes" aqui pertence ao Bolo de Cenoura, então é <h3>.
    -->
       <h3>Ingredientes</h3>
         <p>3 cenouras médias, 2 xícaras de açúcar, 2 xícaras de farinha...</p>

</body>

</html>
