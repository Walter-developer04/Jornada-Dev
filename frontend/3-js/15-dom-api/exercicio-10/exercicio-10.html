<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercicio-10.css">
    <title>Exercicio 10 - addEventListener()</title>
</head>
<body>
    <!-- Container principal com os elementos interativos -->
    <main class="container">
        <h1>Exercicio 10: addEventListener()</h1>
        <!-- Botao que dispara a interacao do usuario -->
        <button id="btn-interagir" class="botao-acao" type="button">Clique para Atualizar</button>
        <!-- Painel cujo texto e estilo serao atualizados dinamicamente -->
        <div id="painel-status" class="status-inativo">
            <p id="texto-status">Aguardando interacao do usuario no botao acima.</p>
        </div>
    </main>

    <!-- Script externo que vincula o evento e manipula a DOM -->
    <script src="exercicio-10.js"></script>
</body>
</html>
