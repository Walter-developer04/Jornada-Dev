<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercicio-09.css">
    <title>Exercicio 09 - remove()</title>
</head>
<body>
    <!-- Container principal demonstrando a remocao de elementos -->
    <main class="container">
        <h1>Exercicio 09: remove()</h1>
        <!-- Elemento temporario que sera excluido pelo JavaScript -->
        <div id="bloco-remover" class="bloco-aviso">
            Este aviso temporario sera removido da pagina pela DOM.
        </div>
        <!-- Indicador de confirmacao da remocao -->
        <p class="bloco-sucesso">O aviso foi localizado e removido com sucesso da pagina pelo script.</p>
    </main>

    <!-- Script externo que executa a exclusao do no -->
    <script src="exercicio-09.js"></script>
</body>
</html>
