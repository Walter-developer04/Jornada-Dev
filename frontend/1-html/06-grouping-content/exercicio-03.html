<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 03</title>
  </head>

  <style>
    body {
        font-family: 'Segoe UI';
        line-height: 1.7;
    }
    div {
        border: 3px solid rgb(14, 16, 139);
        width: 28%;
        padding-left: 5px;

    }
    span {
        color: rgb(179, 9, 9);
        font-weight: bold;
        border: 2px solid rgb(99, 14, 139);
        padding: 1.5px;
    }
    h1 {
        font-family: Georgia;
    }
  </style>
  <body>
    <div>
      <h1>Informações pessoais</h1>

      <p>Meu nome é <span>Walter</span>.</p>

      <p>Estou estudando <span>HTML</span>.</p>

      <p>Minha próxima etapa é estudar <span>CSS</span>.</p>
    </div>

    <!--
        O <span> pode envolver apenas uma parte do texto.

        Não é necessário usar <span> em um texto inteiro
        quando o <p> já é suficiente.

        Use <span> quando precisar separar uma parte
        específica do conteúdo.

        Não use <span> para substituir uma tag que já
        possui uma função própria.

        O <span> não deve ser usado apenas para criar
        espaços ou quebras de linha.
    -->
  </body>
</html>
