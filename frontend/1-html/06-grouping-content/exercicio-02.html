<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 02</title>
  </head>
  <style>
    div {
        border: 2px solid black;
        width: 20%;
        margin-bottom: 10px;
        padding-left: 5px;
    }
  </style>
  <body>
    <!--
        Agrupe conteúdos que pertencem à mesma parte
        dentro de uma <div>.
    -->

    <div>
      <h1>Sobre mim</h1>
      <p>Meu nome é Walter.</p>
      <p>Estou estudando HTML.</p>
    </div>

    <div>
      <h2>Meus estudos</h2>
      <p>Estou aprendendo a criar páginas.</p>
    </div>

    <!--
        Cuidado:
        Não coloque todo o conteúdo da página dentro de várias
        <div> sem necessidade.

        Use <div> quando houver uma razão para agrupar conteúdos.

        Se existir uma tag que descreva melhor o conteúdo,
        prefira essa tag em vez de <div>.
    -->
  </body>
</html>
