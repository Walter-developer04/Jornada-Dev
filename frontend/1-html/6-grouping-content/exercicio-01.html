<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div e Span: agrupando conteúdo</title>
</head>

 <style>
      /*
      Colocandouma pitadinha de css para enchegar a div
      */
      div {
        width: 20%;
        border: 2px solid black;
        padding-left: 5px;
      }
      span {
        font-size: 18px;
        font-weight: bold;
        color: rgb(18, 18, 73);
      }
    </style>

<body>
  
   

    <!--
        A tag <div> serve para agrupar conteúdos.

        Ela pode reunir vários elementos que fazem parte
        de uma mesma parte do conteúdo.

        A tag <div> não possui um significado próprio.
        Ela serve apenas para organizar o conteúdo.

        A tag <span> serve para agrupar uma pequena parte
        de um conteúdo, normalmente dentro de um texto.

        A tag <span> também não possui um significado próprio.

        Use <div> quando precisar agrupar uma parte maior
        do conteúdo.

        Use <span> quando precisar separar uma pequena parte
        dentro de um conteúdo.

        Não use <div> quando existir uma tag que já descreva
        corretamente o conteúdo.

        Não use <span> apenas por usar. Ele deve envolver
        uma parte específica do conteúdo.
    -->

    <div>
        <h1>Minha página</h1>
        <p>Este é um exemplo de conteúdo agrupado.</p>
    </div>

    <p>
        Meu nome é <span>Walter</span>.
    </p>

</body>
</html>
