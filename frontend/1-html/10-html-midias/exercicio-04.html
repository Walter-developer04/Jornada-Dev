<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio</title>
</head>
<body>
  <h1 style="font-size: 60px; font-family: arial; color: rgb(247, 36, 36);">Audio</h1>

    <!-- 
    <audio controls>: Incorpora um player de áudio na página.
    Use quando quiser permitir que o usuário ouça um arquivo de som diretamente no navegador.
    O atributo "controls" exibe os botões de play, pause e volume.
    <source>: Define o arquivo de áudio e seu formato (type).
  -->  

  <audio controls>
    <source src="audio/musica.mp3" type="audio/mpeg">

  </audio>
</body>
</html>
