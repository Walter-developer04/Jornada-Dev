<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Images</title>
</head>
<body>
  <h1 style="font-size: 65px;
  font-family: sans-serif;
  color: #414a5f;">Images</h1>

  <!-- Mostra uma imagem na página -->
  <img src="img/paisagem.jpg" alt="Paisagem" width="800" height="500">

  <!-- O texto alternativo descreve a imagem -->
  <img src="img/produto.jpg" alt="Foto do produto" width="600" height="900">
    <br>
  <!-- Width e height definem o tamanho exibido -->
  <img src="icon/icone.png" alt="Ícone" width="24" height="24">
</body>
</html>
