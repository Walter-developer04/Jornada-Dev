<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>img vs figure</title>
</head>
<body>
  <h1>img vs figure</h1>

  <!-- Imagem simples criada com img -->
  <img src="img/mascote-css.jpg" alt="Mascote do CSS" width="300" height="200">

  <!-- A tag figure agrupa imagem e legenda -->
  <figure>
    <!-- Imagem dentro do figure -->
    <img src="img/mascote-js.webp" alt="Mascote do JavaScript" width="300" height="200">

    <!-- Legenda da imagem -->
    <figcaption style="font-family: sans-serif;">Mascote JS em plena execução de um script interativo.</figcaption>
  </figure>
</body>
</html>
