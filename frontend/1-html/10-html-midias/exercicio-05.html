<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video</title>
  </head>
  <body>
    <h1 style="color: rgb(255, 136, 0); font-family: arial; font-size: 65px">
      Video
      <span style="color: #99beb7; font-size: 40px">mp4 </span>
    </h1>

    <!-- Adiciona um vídeo com controles -->
    <video controls width="480">
      <!-- Primeira opção de vídeo -->
      <source src="video/video.mp4" type="video/mp4" />

    </video>
  </body>
</html>
