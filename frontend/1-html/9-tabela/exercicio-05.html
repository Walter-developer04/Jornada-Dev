<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 05 - Associação explícita de cabeçalhos</title>
</head>
<body>

    <h1>Uma tabela mais complexa e acessível</h1>

    <!--
        Em tabelas complexas, podemos associar cada célula
        aos cabeçalhos que explicam seu conteúdo.

        Cada <th> recebe um id único.
        Cada <td> usa o atributo headers para informar
        quais cabeçalhos estão relacionados àquele dado.

        O valor de "headers" é uma lista de ids separados por espaço.
    -->

    <table>
        <caption>Associação de cabeçalhos em tabelas</caption>

        <thead>
            <tr>
                <th id="aluno" rowspan="2">Aluno</th>
                <th id="avaliacoes" colspan="3">Avaliações</th>
                <th id="frequencia" rowspan="2">Frequência</th>
            </tr>

            <tr>
                <th id="prova">Prova</th>
                <th id="trabalho">Trabalho</th>
                <th id="projeto">Projeto</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th id="ana" scope="row">Ana</th>
                <td headers="ana avaliacoes prova">8,5</td>
                <td headers="ana avaliacoes trabalho">9,0</td>
                <td headers="ana avaliacoes projeto">9,5</td>
                <td headers="ana frequencia">96%</td>
            </tr>

            <tr>
                <th id="bruno" scope="row">Bruno</th>
                <td headers="bruno avaliacoes prova">7,5</td>
                <td headers="bruno avaliacoes trabalho">8,0</td>
                <td headers="bruno avaliacoes projeto">8,5</td>
                <td headers="bruno frequencia">91%</td>
            </tr>

            <tr>
                <th id="carla" scope="row">Carla</th>
                <td headers="carla avaliacoes prova">9,5</td>
                <td headers="carla avaliacoes trabalho">9,5</td>
                <td headers="carla avaliacoes projeto">10,0</td>
                <td headers="carla frequencia">99%</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
