<!DOCTYPE html>
<html lang="pt-BR">
    <head>
       <!-- ====== MAIS COMUNS ====== -->
   <!-- charset: defini a codificação de caratere como o UTF-8. Sem isso, acentos e carateres especiais podem quebra -->
        <meta charset="UTF-8" />


        <!-- viewport: deixa a pagina responsiva.
         Sem isso, o celular mostra a pagina miniatura comose fosse desktop -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        

          <!-- ======= NÃO TAM COMUNS MAS TAMBEM UTILIZADOS ====== -->

        <!-- description: resumo da página.
         O google mostra esse texto abaixo do título nos resultados de busca-->
        <meta name="description" content="" />

          <!--theme-color: mudar a cor da barra do navegador no celular. -->       
          <meta name="theme-color" content="#0C0C0B" />
           <title>Meta tags</title>
    </head>
    <body>
        <h1>Metadados</h1>
        <p></p>
    </body>
</html>
