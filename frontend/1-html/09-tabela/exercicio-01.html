<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 01 - Estrutura básica de tabela</title>
</head>
<body>

    <h1>Estrutura básica de uma tabela</h1>

    <!--
        A tabela é criada com <table>.
        Cada linha é criada com <tr>.
        Os títulos das colunas usam <th>.
        Os dados da tabela usam <td>.
    -->

    <table>
        <tr>
            <th>Produto</th>
            <th>Categoria</th>
            <th>Preço</th>
        </tr>

        <tr>
            <td>Caderno</td>
            <td>Papelaria</td>
            <td>R$ 25,00</td>
        </tr>

        <tr>
            <td>Caneta</td>
            <td>Papelaria</td>
            <td>R$ 5,00</td>
        </tr>

        <tr>
            <td>Mochila</td>
            <td>Acessórios</td>
            <td>R$ 120,00</td>
        </tr>
    </table>

</body>
</html>
