<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercicio-12.css">
    <title>Filtro blur</title>
</head>
<body>
    <main>
        <h1>Filtro blur</h1>
        <p>O desfoque aplicado sobre toda a área da imagem.</p>

        <section class="comparacao-do-filtro">
            <figure>
                <img src="img-12.jfif" alt="Fotografia de demonstração">
                <figcaption>Imagem original</figcaption>
            </figure>

            <figure>
                <!-- blur aplica um desfoque sobre a imagem; o valor em pixels define o raio de mistura entre os pixels vizinhos. -->
                <img class="imagem-desfocada" src="img-12.jfif" alt="Fotografia de demonstração">
                <figcaption>filter: blur(6px)</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
