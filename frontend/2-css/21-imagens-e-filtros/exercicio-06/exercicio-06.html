<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercicio-06.css">
    <title>Filtro saturate</title>
</head>
<body>
    <main>
        <h1>Filtro saturate</h1>
        <p>O mesmo filtro aplicado com um valor abaixo e outro acima do padrão de 100%.</p>

        <section class="comparacao-do-filtro">
            <figure>
                <img src="img-06.png" alt="Feirante vendendo frutas">
                <figcaption>Imagem original</figcaption>
            </figure>

            <figure>
                <!-- Valores abaixo de 100% reduzem a saturação, deixando as cores mais próximas do cinza. -->
                <img class="imagem-desbotada" src="img-06.png" alt="Feirante vendendo frutas">
                <figcaption>filter: saturate(40%)</figcaption>
            </figure>

            <figure>
                <!-- Valores acima de 100% aumentam a saturação, tornando as cores mais intensas. -->
                <img class="imagem-intensificada" src="img-06.png" alt="Feirante vendendo frutas">
                <figcaption>filter: saturate(220%)</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
