<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercicio-04.css">
    <title>Filtro grayscale</title>
</head>
<body>
    <main>
        <h1>Filtro grayscale</h1>
        <p>A mesma fotografia colorida antes e depois da conversão para tons de cinza.</p>

        <section class="comparacao-do-filtro">
            <figure>
                <img src="img-04.png" alt="imagem de um mercado por dentro">
                <figcaption>Imagem original</figcaption>
            </figure>

            <figure>
                <!-- grayscale reduz a saturação das cores da imagem; em 100%, restam apenas tons de cinza. -->
                <img class="imagem-filtrada" src="img-04.png" alt="Image de um mercado por dentro">
                <figcaption>filter: grayscale(100%)</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
