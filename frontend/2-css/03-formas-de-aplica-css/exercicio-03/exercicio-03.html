<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Para conectar o arquivo externo do css ao documento html tem que usar a tag link no head -->
    <link rel="stylesheet" href="exercicio-03.css">
    <title>CSS: externo</title>
</head>
<body>
    <h1>CSS EXTERNO</h1>
    <p> CSS externo é quando o código CSS é escrito em um arquivo separado
    do HTML. <br> Esse arquivo é conectado ao HTML através da tag &lt;link&gt;.
   <br> Essa forma facilita a organização e permite reutilizar o mesmo CSS
    em várias páginas.</p>
</body>
</html>
