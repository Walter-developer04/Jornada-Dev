<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="stylesheet" href="exercicio-05.css">
    <title>Exercicio 05 - Visibility</title>
</head>
<body>
    <h1>Demonstracao: visibility: hidden</h1>
    <p>
        O "Card 2" possui <code>visibility: hidden</code>. Ele fica invisivel, mas seu espaco continua preservado no layout.
    </p>

    <div class="container">
        <div class="card card-1">Card 1</div>
        <div class="card card-invisivel">Card 2 (visibility: hidden)</div>
        <div class="card card-3">Card 3</div>
    </div>
</body>
</html>
