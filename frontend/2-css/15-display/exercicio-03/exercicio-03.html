    <h1>Demonstracao: display: inline-block</h1>
    <p>
        Elementos com <code>display: inline-block</code> alinham-se lado a lado (como inline), mas respeitam largura e altura (como block).
    </p>

    <div class="container">
        <div class="caixa">Caixa 1</div>
        <div class="caixa">Caixa 2</div>
