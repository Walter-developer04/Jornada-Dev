<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="stylesheet" href="exercicio-01.css">
    <title>Exercicio 01 - Display Inline</title>
</head>
<body>
    <h1>Demonstracao: display: inline</h1>
    <p>
        Elementos com <code>display: inline</code> fluem na mesma linha do texto e ocupam apenas o espaco do conteudo.
    </p>

    <div class="container">
        Texto inicial:
        <span class="destaque">Item 1 (inline)</span>
        <span class="destaque">Item 2 (inline)</span>
        <span class="destaque">Item 3 (inline)</span>
        texto continuado.
    </div>
</body>
</html>
