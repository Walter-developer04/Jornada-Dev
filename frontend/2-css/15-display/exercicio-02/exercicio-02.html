<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="stylesheet" href="exercicio-02.css">
    <title>Exercicio 02 - Display Block</title>
</head>
<body>
    <h1>Demonstracao: display: block</h1>
    <p>
        Elementos com <code>display: block</code> comecam em nova linha e ocupam toda a largura disponivel do container pai.
    </p>

    <div class="bloco bloco-padrao">Bloco 1 (largura padrao de 100%)</div>
    <div class="bloco bloco-largura">Bloco 2 (largura personalizada: 260px)</div>
    <div class="bloco bloco-empilhado">Bloco 3 (empilhado automaticamente abaixo)</div>
</body>
</html>
