<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="stylesheet" href="exercicio-04.css">
    <title>Exercicio 04 - Display None</title>
</head>
<body>
    <h1>Demonstracao: display: none</h1>
    <p>
        O "Card 2" possui <code>display: none</code>. Ele e removido completamente da renderizacao e nao ocupa espaco.
    </p>

    <div class="container">
        <div class="card card-1">Card 1</div>
        <div class="card card-removido">Card 2 (display: none)</div>
        <div class="card card-3">Card 3</div>
    </div>
</body>
