<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercicio-10.css">
    <title>z-index em grid items</title>
</head>
<body>
    <header>
        <h1>z-index em grid items</h1>
        <p>Grid items aceitam z-index mesmo com position: static.</p>
    </header>
    <main>
        <section class="grade-demonstracao">
            <article class="grade-item-fundo">z-index: 1</article>
            <article class="grade-item-meio">z-index: 3</article>
            <article class="grade-item-topo">z-index: 2</article>
        </section>
        <section class="nota-grid">
            <h2>Comportamento especial</h2>
            <p>Em grid items, o z-index funciona mesmo sem position.</p>
        </section>
    </main>
</body>
</html>
