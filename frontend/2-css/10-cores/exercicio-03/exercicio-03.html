<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="exercicio-03.css">
  <title>Exercício 03 - Cores com HEX</title>
</head>
<body>
  <main>
    <h1>Cores com HEX</h1>
    <p>
      No formato hexadecimal, a cor começa com # e tem seis dígitos.
      Cada par controla um canal: #RRGGBB, ou seja, vermelho, verde e azul.
      O valor 00 é o mínimo e ff é o máximo.
    </p>

    <!-- Um canal em ff e os outros dois em 00 -->
    <div class="caixa vermelho">#ff0000</div>
    <div class="caixa verde">#00ff00</div>
    <div class="caixa azul">#0000ff</div>

    <!-- Dois canais no máximo criam uma mistura -->
    <div class="caixa amarelo">#ffff00</div>

    <!-- Aqui 88 é um valor intermediário, entre 00 e ff -->
    <div class="caixa laranja">#ff8800</div>
  </main>
</body>
</html>
