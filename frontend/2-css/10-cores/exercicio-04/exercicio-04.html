<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="exercicio-04.css">
   <title>Exercício 04 - Named Colors</title>
</head>
<body>
  <main>
    <h1>Named Colors</h1>
    <p>
      O CSS conhece mais de 140 cores pelo nome.
      Assim, podemos escrever o nome da cor direto na propriedade,
      sem nenhum código.
    </p>

    <!-- Cada cartão usa apenas o nome da cor no CSS -->
    <div class="cartao vermelho">red</div>
    <div class="cartao azul">blue</div>
    <div class="cartao verde">green</div>
    <div class="cartao laranja">orange</div>
    <div class="cartao roxo">purple</div>

    <p>Sem códigos e sem parênteses: só o nome da cor escrito em inglês.</p>
  </main>
</body>
</html>
