<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS: inline</title>
</head>
<body>

      
    <!--
        CSS Inline é uma forma de aplicar CSS diretamente
        dentro da tag HTML usando o atributo "style".

        O CSS é escrito no próprio elemento que queremos estilizar.

        Neste exemplo, o elemento <h1> possui o atributo "style".
    -->

    <h1 style="color: rgb(10, 2, 54);
     font-family: arial;
     font-size: 65px;
     text-align: center;">EXERCICIO: css inline</h1>
</body>
</html>
