<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercicio-02.css">
    <title>::first-letter - Estilo para a primeira letra</title>
</head>
<body>
    <main>
        <header>
            <h1>::first-letter</h1>
            <p>Estilo para a primeira letra</p>
        </header>
                    <section>
                <!-- Este parágrafo demonstra o efeito na primeira letra -->
                <p>Este é um parágrafo onde apenas a primeira letra receberá um estilo diferente. O restante do texto permanecerá com o estilo padrão. Isso acontece porque o pseudo-elemento ::first-letter aplica estilos apenas à primeira letra do texto.</p>
            </section>
    </main>
</body>
</html>
