<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercicio-07.css">
    <title>::placeholder - Estilo para placeholder de input</title>
</head>
<body>
    <main>
        <header>
            <h1>::placeholder</h1>
            <p>Estilo para placeholder de input</p>
        </header>
                    <section>
                <!-- Este input demonstra o uso de ::placeholder -->
                <form>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome">
                </form>
            </section>
    </main>
</body>
</html>
