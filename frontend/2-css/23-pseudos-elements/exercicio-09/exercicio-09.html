<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercicio-09.css">
    <title>::backdrop - estilo para o backdrop de um modal</title>
</head>

<body>
    <main>
        <header>
            <h1>::backdrop</h1>
            <p>estilo aplicado a area atras de um modal</p>
        </header>

        <section>
            <!-- este botao abre o dialog como modal sem precisar de javascript -->
            <button type="button" command="show-modal" commandfor="exemplo-modal">
                abrir modal
            </button>

            <!-- este dialog sera exibido como modal e, por isso, tera um ::backdrop -->
            <dialog id="exemplo-modal">
                <p>este dialog esta aberto como modal.</p>

                <!-- este botao fecha o dialog usando um comando html nativo -->
                <button type="button" command="close" commandfor="exemplo-modal">
                    fechar
                </button>
            </dialog>
        </section>
    </main>
</body>
</html>
