<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="exercicio-03.css">
  <title>Exercicio 03 - outline-color</title>
</head>
<body>

  <h1>outline-color</h1>
  <p>A cor do outline pode ser definida por nome, hex, rgb ou pela palavra-chave currentColor.</p>

  <!-- Cor por nome -->
  <div class="nome">color: crimson</div>

  <!-- Cor por valor hexadecimal -->
  <div class="hex">color: #2a9d8f</div>

  <!-- Cor por rgb() -->
  <div class="rgb">color: rgb(230, 126, 34)</div>

  <!-- currentColor herda a cor do texto do elemento -->
  <div class="current">color: currentColor</div>

</body>
</html>
