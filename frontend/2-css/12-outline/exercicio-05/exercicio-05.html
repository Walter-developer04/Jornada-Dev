<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="exercicio-05.css">
  <title>Exercicio 05 - outline (shorthand)</title>
</head>
<body>

  <h1>outline (shorthand)</h1>
  <p>
    A propriedade <code>outline</code> e um shorthand que combina
    <code>outline-width</code>, <code>outline-style</code> e <code>outline-color</code>
    em uma unica declaracao. A ordem dos valores nao importa.
  </p>

  <!-- Apenas o style definido; width e color usam valores iniciais -->
  <div class="so-style">so style: solid</div>

  <!-- Style e color; width usa o valor inicial (medium) -->
  <div class="style-color">style + color</div>

  <!-- Width e style; color usa currentColor -->
  <div class="width-style">width + style</div>

  <!-- Os tres valores juntos -->
  <div class="completo">width + style + color</div>

</body>
</html>
