<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="exercicio-02.css">
  <title>Exercicio 02 - outline-width</title>
</head>
<body>

  <h1>outline-width</h1>
  <p>A espessura do outline pode ser definida por palavras-chave ou por valores em px.</p>

  <!-- Palavras-chave documentadas: thin, medium, thick -->
  <div class="thin">thin</div>
  <div class="medium">medium (padrao)</div>
  <div class="thick">thick</div>

  <!-- Valores numericos em px -->
  <div class="px1">1px</div>
  <div class="px4">4px</div>
  <div class="px8">8px</div>

</body>
</html>
