<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="exercicio-04.css">
  <title>Exercicio 04 - outline-offset</title>
</head>
<body>

  <h1>outline-offset</h1>
  <p>Define a distancia entre o outline e a borda do elemento. Aceita valores negativos.</p>

  <!-- Sem offset: outline colado na borda -->
  <div class="zero">offset: 0px</div>

  <!-- Offset positivo: outline afastado para fora -->
  <div class="positivo">offset: 8px</div>

  <!-- Offset negativo: outline entra para dentro do elemento -->
  <div class="negativo">offset: -6px</div>

</body>
</html>
