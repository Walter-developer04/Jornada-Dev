<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
   <link rel="stylesheet" href="exercicio-02.css">
  <title>Deslocamentos da sombra</title>
</head>
<body>
  <h1>Deslocamentos horizontal e vertical</h1>

  <section class="grupo">
    <!-- Valores positivos movem para direita e baixo -->
    <div class="caixa direita-baixo">Direita e baixo</div>

    <!-- Offset-x negativo move para a esquerda -->
    <div class="caixa esquerda-baixo">Esquerda e baixo</div>

    <!-- Offset-y negativo move para cima -->
    <div class="caixa direita-cima">Direita e cima</div>

    <!-- Os dois offsets negativos -->
    <div class="caixa esquerda-cima">Esquerda e cima</div>
  </section>
</body>
</html>
