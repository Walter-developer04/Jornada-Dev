<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="exercicio-05.css">
  <title>Cor da sombra</title>
</head>
<body>
  <h1>Cor e transparência</h1>

  <section class="grupo">
    <!-- Cor definida diretamente -->
    <div class="caixa cor-nomeada">Cor azul</div>

    <!-- Alfa da cor deixa a sombra transparente -->
    <div class="caixa cor-transparente">Cor transparente</div>

    <!-- Sem cor, a sombra usa a cor atual -->
    <div class="caixa cor-atual">Usa currentColor</div>
  </section>
</body>
</html>
