<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercicio-05.css">
    <title>INLINE vs INTERNO</title>
</head>
<style>
    /* O CSS interno define o h1 como azul.  */
    h1 {
        color: blue;
    }
    /* O CSS interno define o p como vermelho. */
    p {
        color: red;
    }
</style>
<body>
    <!-- O CSS iline está no próprio elemento.
         Por isso, o h1 fica vermelho. -->
    <h1 style="color: red;">Iline vs Interno</h1>

    <!-- A mesma coisa vale para esse parágrafo-->
    <p style="color: blue;">inline ganha</p>
</body>
</html>
