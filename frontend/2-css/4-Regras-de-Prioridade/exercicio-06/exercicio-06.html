<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="exercicio-06.css">

    <title>Interno vs Externo</title>

</head>

<style>

    /* O CSS interno deixa o h1 roxo. */
    h1 {
        color: purple;
    }

    /* O CSS interno deixa o p amarelo. */
    p {
        color: yellow;
    }

</style>

<body>

    <!-- O h1 também recebe uma regra no arquivo externo.
         Neste caso, o CSS interno ganha. -->
    <h1>Interno vs Externo</h1>

    <!-- O p também recebe uma regra no arquivo externo.
         Neste caso, o CSS interno ganha. -->
    <p>Interno ganha.</p>

</body>

</html>
