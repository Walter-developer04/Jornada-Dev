<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="exercicio-02.css">
  <title>Exercício 02 — Keyframe Animations</title>
</head>
<body>
  <main>
    <header>
      <h1>Keyframe Animations</h1>
      <p>Com <code>@keyframes</code> você define etapas da animação e a controla com <code>animation</code>.</p>
    </header>

    <section aria-labelledby="exemplos">
      <h2 id="exemplos">Exemplos</h2>
      <div class="grid">
        <article class="card">
          <h3>Pulse</h3>
          <p>Escala repetida, em loop infinito.</p>
          <div class="palco"><div class="bolinha bolinha--pulse"></div></div>
        </article>
        <article class="card">
          <h3>Bounce</h3>
          <p>Movimento vertical com aceleração.</p>
          <div class="palco"><div class="bolinha bolinha--bounce"></div></div>
        </article>
        <article class="card">
          <h3>Spin</h3>
          <p>Rotação contínua e linear.</p>
          <div class="palco"><div class="quadrado quadrado--spin"></div></div>
        </article>
        <article class="card">
          <h3>Fade + Slide</h3>
          <p>Entrada com opacidade e deslocamento.</p>
          <div class="palco"><div class="quadrado quadrado--entrada"></div></div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
