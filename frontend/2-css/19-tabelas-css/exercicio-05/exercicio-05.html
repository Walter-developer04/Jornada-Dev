<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercicio-05.css">
    <title>Exercício Tabelas 05</title>
</head>
<body>
    <h1>Parte 05 — Bordas e espaçamento entre células</h1>
    <p>Controle de bordas com border-collapse, border-spacing e border individual</p>
    
    <h2>Tabela com bordas colapsadas</h2>
    <table class="tabela-bordas-colapsadas">
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>
        </tr>
        <tr>
            <td>Teclado</td>
            <td>15</td>
            <td>120.00</td>
        </tr>
        <tr>
            <td>Mouse</td>
            <td>30</td>
            <td>45.00</td>
        </tr>
    </table>
    
    <h2>Tabela com bordas separadas</h2>
    <table class="tabela-bordas-separadas">
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>
        </tr>
        <tr>
            <td>Teclado</td>
            <td>15</td>
            <td>120.00</td>
        </tr>
        <tr>
            <td>Mouse</td>
            <td>30</td>
            <td>45.00</td>
        </tr>
    </table>
</body>
</html>
