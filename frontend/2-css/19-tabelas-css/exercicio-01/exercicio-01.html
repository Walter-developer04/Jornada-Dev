<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercicio-01.css">
    <title>Exercício Tabelas 01</title>
</head>
<body>
    <h1>Parte 01 — Estrutura básica da tabela</h1>
    <p>Demonstração da estrutura fundamental de uma tabela com table, tr, th, td</p>
    
    <table class="tabela-estrutura-basica">
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>
        </tr>
        <tr>
            <td>Teclado</td>
            <td>15</td>
            <td>120.00</td>
        </tr>
        <tr>
            <td>Mouse</td>
            <td>30</td>
            <td>45.00</td>
        </tr>
        <tr>
            <td>Monitor</td>
            <td>10</td>
            <td>850.00</td>
        </tr>
    </table>
</body>
</html>
