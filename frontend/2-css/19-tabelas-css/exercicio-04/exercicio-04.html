<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercicio-04.css">
    <title>Exercício Tabelas 04</title>
</head>
<body>
    <h1>Parte 04 — Alinhamento do conteúdo em células</h1>
    <p>Uso de text-align e vertical-align para posicionar conteúdo horizontal e verticalmente</p>
    
    <table class="tabela-alinhamento">
        <tr>
            <th class="celula-cabecalho-topo">Produto (Topo)</th>
            <th class="celula-cabecalho-meio">Quantidade (Meio)</th>
            <th class="celula-cabecalho-base">Preço (Base)</th>
        </tr>
        <tr>
            <td class="celula-conteudo-topo">Teclado</td>
            <td class="celula-conteudo-meio">15</td>
            <td class="celula-conteudo-base">120.00</td>
        </tr>
        <tr>
            <td class="celula-conteudo-topo">Mouse sem fio</td>
            <td class="celula-conteudo-meio">30</td>
            <td class="celula-conteudo-base">45.00</td>
        </tr>
        <tr>
            <td class="celula-conteudo-topo">Monitor 4K</td>
            <td class="celula-conteudo-meio">10</td>
            <td class="celula-conteudo-base">850.00</td>
        </tr>
        <tr>
            <td class="celula-conteudo-topo">Headset</td>
            <td class="celula-conteudo-meio">25</td>
            <td class="celula-conteudo-base">150.00</td>
        </tr>
    </table>
</body>
</html>
