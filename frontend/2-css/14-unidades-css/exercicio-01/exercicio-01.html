<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercicio-01.css">
    <title>Exercicio 01 - CSS Units</title>
</head>
<body>
    <h1>Unidade Absoluta: Pixel (px)</h1>
    <p class="descricao">O pixel (px) é uma unidade de medida com tamanho fixo. O valor definido em pixels permanece o mesmo, independentemente do elemento pai ou da resolução da janela.</p>

    <div class="caixa-pequena">
        <p>Largura fixa de 150px</p>
    </div>

    <div class="caixa-media">
        <p>Largura fixa de 300px</p>
    </div>

    <div class="caixa-grande">
        <p>Largura fixa de 450px</p>
    </div>
</body>
</html>
