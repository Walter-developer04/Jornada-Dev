<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercicio-05.css">
    <title>Exercicio 05 - CSS Units</title>
</head>
<body>
    <h1>Porcentagem (%) em Relação ao Pai</h1>
    <p class="descricao">A unidade de porcentagem (%) calcula sua dimensão com base direta na largura ou altura do elemento pai imediato.</p>

    <div class="moldura-pai">
        <p class="rotulo-pai">Elemento Pai: largura fixa de 500px</p>
        
        <div class="barra barra-25">
            <p>25% do pai (125px)</p>
        </div>

        <div class="barra barra-50">
            <p>50% do pai (250px)</p>
        </div>

        <div class="barra barra-75">
            <p>75% do pai (375px)</p>
        </div>

        <div class="barra barra-100">
            <p>100% do pai (500px)</p>
        </div>
    </div>
</body>
</html>
