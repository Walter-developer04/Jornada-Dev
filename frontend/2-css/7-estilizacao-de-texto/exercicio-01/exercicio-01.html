  <body>
    <h1 style="color: #2d1e38;">O QUE A PROPRIEDADE COLOR FAZ ?</h1>
    <p style="font-size: 18px; font-family: sans-serif; font-weight: 600; color: #3e0663;">
        A propriedade color serve para estilizar textos com diferentes tonalidades. 
        Veja exemplos aplicados: 
        <span class="vermelho">Vermelho</span>, 
        <span class="azul">Azul</span>, 
        <span class="verde">Verde</span>, 
        <span class="amarelo">Amarelo</span> e 
        <span class="laranja">Laramja</span>.
    </p>
  </body>
