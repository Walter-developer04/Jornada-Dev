<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula: Seletores Atributos e Valores</title>
</head>

 <style>
     /*                    ====================
                             SELETORES CSS 
                           ====================
                    
        SELETOR: é o elemento do html que ira ser estilizado no css.
        Nesse caso o h1.

        PROPRIEDADES: é aquilo que eu quero modificar no elemento. Como a cor, font ou tamanho.

        VALOR: é a definição que determina como uma propriedade CSS será aplicada ao elemento CSS.
                                                                                                   */

    /*
        seletor {
        propriedade: valor;
             }
                      */
    h1 {
        font-size: 60px;
        color: rgb(121, 219, 41);
        text-align: center;
        font-family: sans-serif;
    }

 </style>
<body>
    <h1>Seletores CSS</h1>
    
</body>
</html>
